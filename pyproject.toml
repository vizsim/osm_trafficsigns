[project]
name = "traffic-sign-processing"
version = "0.1.0"
description = "Extract traffic sign locations and directions from OSM data (pure-Python port, GeoParquet output)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "osmium>=3.7",       # pyosmium: reads .osm.pbf, replaces the Lua/osm2pgsql import
    "geopandas>=1.0",    # spatial dataframes, replaces PostGIS tables
    "shapely>=2.0",      # geometry ops, replaces ST_* functions
    "pyproj>=3.6",       # CRS transforms (WGS84 -> local UTM)
    "pyarrow>=16.0",     # GeoParquet writer
    "numpy>=1.26",
]

[project.scripts]
# Replaces data_preparation_traffic_sign.sh
tsp = "tsp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]

[tool.pytest.ini_options]
# tests import `tsp` from the src-layout; make that importable even without
# an editable install, and only collect tests from tests/.
pythonpath = ["src"]
testpaths = ["tests"]

